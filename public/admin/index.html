<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Voix Lactee CMS</title>
		<style>
			body {
				font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
				padding: 2rem;
			}
		</style>
	</head>
	<body>
		<p id="status">Verification d'acces...</p>
		<noscript>JavaScript est requis pour utiliser l'administration.</noscript>
		<script>
			(function () {
				const AUTH_KEY = 'vl_admin_ok';
				const PASSWORD = 'tktcestsecret';
				const status = document.getElementById('status');
				const hasAccess = sessionStorage.getItem(AUTH_KEY) === '1';

				if (!hasAccess) {
					const entered = window.prompt('Mot de passe admin');
					if (entered !== PASSWORD) {
						if (status) status.textContent = 'Acces refuse.';
						window.location.replace('../');
						return;
					}
					sessionStorage.setItem(AUTH_KEY, '1');
				}

				if (status) status.textContent = "Chargement de l'interface Decap CMS...";
				const script = document.createElement('script');
				script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
				script.async = true;
				document.body.appendChild(script);
			})();
		</script>
	</body>
</html>
