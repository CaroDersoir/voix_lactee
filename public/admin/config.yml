backend:
  name: github
  repo: CaroDersoir/voix_lactee
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: songs
    label: Chants
    folder: src/content/songs
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Tonalité, name: key, widget: string, required: false }
      - { label: Occasion liturgique, name: occasion, widget: string, required: false }
      - { label: Partition PDF, name: pdf, widget: file, required: false }
      - { label: Notes, name: body, widget: markdown, required: false }

  - name: masses
    label: Messes & Événements
    folder: src/content/masses
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Lieu, name: location, widget: string }
      - { label: Heure, name: time, widget: string, required: false }
      - { label: Description, name: body, widget: markdown, required: false }