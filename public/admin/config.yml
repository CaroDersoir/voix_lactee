backend:
  name: github
  repo: CaroDersoir/voix_lactee
  branch: main

local_backend: true
locale: "fr"
site_url: "https://carodersoir.github.io/voix_lactee"
display_url: "https://carodersoir.github.io/voix_lactee"

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "songs"
    label: "Repertoire"
    folder: "src/content/songs"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Tonalite", name: "key", widget: "string" }
      - { label: "Occasion liturgique", name: "occasion", widget: "string" }
      - { label: "Partition PDF", name: "pdf", widget: "string", required: false, hint: "Exemple: uploads/mon-chant.pdf" }
      - { label: "Notes", name: "body", widget: "markdown", required: false }

  - name: "events"
    label: "Agenda"
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Heure", name: "time", widget: "string", hint: "Exemple: 10:30" }
      - { label: "Lieu", name: "location", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Details", name: "body", widget: "markdown", required: false }
